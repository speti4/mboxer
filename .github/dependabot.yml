# Weekly dependency updates (task 024): the Cargo lock file and the SHA-pinned actions. A release is
# proposed only after a week, so a compromised or broken version has time to be yanked first. Security
# updates (repo setting, on since 2026-10-18) skip the cooldown.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns: ["*"]
