# zizmor findings accepted on purpose, each with its reason (task 024). An inline `# zizmor: ignore` would
# follow the version comment of a pinned action and keep dependabot from updating that comment.
rules:
  cache-poisoning:
    ignore:
      # rust-cache in the test and lint jobs only speeds up the checks; the release jobs of the same workflow
      # build without a cache, so nothing a cache holds reaches a published zip.
      - ci.yml
