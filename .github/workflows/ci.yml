# Tests, the dependency policy, the workflow lint and the commit rules (task 034) on every push and pull
# request; a `v<version>` tag also packs and publishes the portable zip (task 012). The toolchain is the one
# `rust-toolchain.toml` names (stable). Actions are pinned by commit SHA and bumped by dependabot (task 024).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a pull request run; a main or tag run always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      # The cache only speeds up the tests; the release job builds without it, so nothing it holds is
      # published (the zizmor cache-poisoning finding is ignored in .github/zizmor.yml).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Advisories, licences, bans and sources of the shipped graph (deny.toml, D-011).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # The default features, as the exe is built; the action's own default is --all-features.
          arguments: ""
          command: check

  # zizmor over the workflows and dependabot.yml; findings fail the job as annotations (the private repo
  # has no code scanning to upload SARIF to).
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false

  # The commit rules of docs/git-workflow.md (scripts/check-commit.sh) for every pushed or proposed commit and
  # the pull request text, which a squash merge turns into the commit message; the local hook can be skipped.
  commit-rules:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the commits and the pull request text
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          failed=0
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
            printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pull-request.txt"
            sh scripts/check-commit.sh "$RUNNER_TEMP/pull-request.txt" || { echo "  in the pull request text"; failed=1; }
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="$AFTER^!"
          else
            range="$BEFORE..$AFTER"
          fi
          for commit in $(git rev-list "$range"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message.txt"
            sh scripts/check-commit.sh "$RUNNER_TEMP/message.txt" \
              "$(git log -1 --format=%an "$commit")" "$(git log -1 --format=%ae "$commit")" \
              "$(git log -1 --format=%cn "$commit")" "$(git log -1 --format=%ce "$commit")" \
              || { echo "  in $commit"; failed=1; }
          done
          exit "$failed"

  release:
    needs: [test, deny, workflow-lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # creates the release and uploads the zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      # No rust-cache here: a release is built from a clean target, never from a cache a pull request wrote.
      - name: Build and pack
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release.ps1 -Tag $env:TAG
      # The runner's own gh CLI publishes the release: no third-party action holds the write token.
      - name: Publish the release
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG (Resolve-Path dist/*.zip).Path --verify-tag --generate-notes
