# Tests on Windows, the format check and a macOS-target clippy on Linux, the dependency policy and the workflow
# lint on every push to main and every pull request; the ruleset on `main` requires them (task 028), so no path
# filter skips them (the commit rules have their own workflow, commit-rules.yml). The macOS tests run on a
# `v<version>` tag and on a manual run only: macOS runners are slower and scarcer (task 042, set while the repo
# was private and macOS minutes billed ten times the Linux rate). A tag also packs and publishes the portable
# Windows zip and the macOS app zip, their checksums, their build provenance attestations and the notes from the
# changelog (tasks 012, 025, 018, 028), each zip with its third-party licence page (tasks 025, 041). The
# toolchain is the one `rust-toolchain.toml` names (stable), installed by the runner's own rustup, not by an
# action (task 033); every cargo build runs `--locked`, so a stale `Cargo.lock` fails instead of being rewritten.
# A manual run on a branch also builds the macOS zip and keeps it as an artifact for a day: the way to test a
# macOS change before its merge, try the bundle without a tag, or hand it to someone with a Mac.
# Actions are pinned by commit SHA and bumped by dependabot (task 024).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The cargo settings the former toolchain action exported: no incremental build in CI (it only grows the target
# cache, and the Rust cache keys on it) and coloured cargo output in the log. The cargo-about of the two licence
# pages (tasks 025, 041), built from crates.io with its own lock file; dependabot does not see this pin, so it is
# bumped by hand, here and in the commands of docs/development.md and the two release scripts.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_ABOUT_VERSION: 0.9.2

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a pull request run; a main or tag run always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The shipped platforms: Windows always, macOS on a tag or a manual run (between those, the lint job compiles
  # the macOS target). One runner's failure does not cancel the other's run, so a platform-only problem shows
  # up as exactly one red job.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && '["windows-latest", "macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's preinstalled rustup installs what rust-toolchain.toml names: without an argument (rustup
      # 1.28+) the toolchain and its components, then by name to bring an older preinstalled stable up to date,
      # which the argumentless install leaves as it is. The last two lines put the result in the log.
      - name: Install the Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustup toolchain install --no-self-update "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup show
          rustup component list --installed
      # The cache only speeds up the tests; the release job builds without it, so nothing it holds is
      # published (the zizmor cache-poisoning finding is ignored in .github/zizmor.yml).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The format check, which no platform changes, and clippy for the Apple Silicon target, which compiles the
  # macOS-only code on every change at the Linux rate. DOCS_RS=1 is objc2-exception-helper's own switch to skip
  # its C build script, which needs Apple's compiler; a check does not link, so nothing else needs it.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain of the test job plus the Apple Silicon target.
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup toolchain install --no-self-update "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup target add aarch64-apple-darwin
          rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - name: clippy for aarch64-apple-darwin
        env:
          DOCS_RS: 1
        run: cargo clippy --target aarch64-apple-darwin --all-targets --locked -- -D warnings

  # Advisories, licences, bans and sources of the shipped graph (deny.toml, D-011).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # The default features, as the exe is built; the action's own default is --all-features.
          arguments: ""
          command: check
      # The licence page of the release zip (about.toml, task 025) accepts exactly the licences deny.toml allows.
      - name: about.toml accepts the licences of deny.toml
        run: |
          python3 -I -c '
          import tomllib
          allow = sorted(tomllib.load(open("deny.toml", "rb"))["licenses"]["allow"])
          accepted = sorted(tomllib.load(open("about.toml", "rb"))["accepted"])
          raise SystemExit(0 if allow == accepted else f"deny.toml allows {allow}, about.toml accepts {accepted}")
          '

  # zizmor over the workflows and dependabot.yml; findings fail the job as annotations. No SARIF upload to code
  # scanning: an uploaded finding would not fail this required check.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false

  # The licence page of the macOS zip (task 041): cargo-about over the crates of the two darwin builds. The
  # dependency graph of a target and the licence texts do not depend on the host, so the page renders here, on a
  # Linux runner (task 042), instead of building cargo-about on the slower macOS runner, and
  # bundle-macos packs it. It starts with the checks, not after them, and is ready when bundle-macos starts.
  licences-macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain of the test job; no darwin target, since nothing is compiled for it here.
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup toolchain install --no-self-update "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup show
      - name: Install cargo-about
        run: cargo install cargo-about --version "$CARGO_ABOUT_VERSION" --locked --features cli
      # Fetches the darwin crates' sources, then renders the page from them offline (scripts/bundle-macos.sh).
      - name: Render the licence page for the darwin targets
        run: scripts/bundle-macos.sh --licences-only dist/THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-licences
          path: dist/THIRD-PARTY-LICENSES.html
          if-no-files-found: error
          retention-days: 1

  # The macOS zip (task 018, D-007): the universal, ad-hoc signed mboxer.app packed by scripts/bundle-macos.sh
  # on the macOS runner, with the licence page of licences-macos, and handed to the release job as a
  # short-lived artifact, so one job publishes both zips and one SHA256SUMS.txt. On a manual run the artifact
  # is the result. No rust-cache here either (see the release job).
  bundle-macos:
    needs: [test, lint, deny, workflow-lint, licences-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain of the test job plus the second darwin target: the Apple Silicon runner only has its own.
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup toolchain install --no-self-update "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup show
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-licences
          path: dist/licences
      # The script checks the tag against the Cargo.toml version; a manual run has no tag to check.
      - name: Build and bundle
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/bundle-macos.sh --licences dist/licences/THIRD-PARTY-LICENSES.html ${TAG:+--tag "$TAG"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-zip
          path: |
            dist/mboxer-*-macos.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [test, lint, deny, workflow-lint, bundle-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # creates the release and uploads the zips
      id-token: write # the OIDC token that signs the build provenance attestation
      attestations: write # stores the attestation with the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history with the tags: scripts/changelog.py tells the tasks of a release by the tag trees.
          fetch-depth: 0
      # A release is cut from main only: the ruleset protects main, not every commit a tag could point at.
      - name: The tag is on main
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }
      # The same toolchain as the test job, from rust-toolchain.toml (see the comment there).
      - name: Install the Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustup toolchain install --no-self-update "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup show
      # The licence page of the zip (task 025), with the cargo-about the workflow pins.
      - name: Install cargo-about
        shell: pwsh
        run: cargo install cargo-about --version $env:CARGO_ABOUT_VERSION --locked --features cli
      # No rust-cache here: a release is built from a clean target, never from a cache a pull request wrote.
      - name: Build and pack
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release.ps1 -Tag $env:TAG
      # The macOS zip and its checksum line from the bundle-macos job: the zip goes next to the Windows one,
      # the line into the SHA256SUMS.txt release.ps1 wrote, once the download is verified against it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-zip
          path: dist/macos
      - name: Join the macOS zip and its checksum
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.Substring(1)
          $zip = "dist/macos/mboxer-$version-macos.zip"
          $line = Get-Content dist/macos/SHA256SUMS.txt -Raw
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if (-not $line.StartsWith("$hash  mboxer-$version-macos.zip")) { throw "the macOS zip does not match its checksum: $line" }
          Move-Item $zip dist/
          $sums = (Resolve-Path dist/SHA256SUMS.txt).Path
          [System.IO.File]::AppendAllText($sums, $line, (New-Object System.Text.UTF8Encoding $false))
          Get-Content $sums
      # Build provenance for every file SHA256SUMS.txt lists (both zips), signed through the job's OIDC token and
      # checked with `gh attestation verify <zip> --repo speti4/mboxer` (task 028).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt
      # The runner's own gh CLI publishes the release: no third-party action holds the write token. The notes
      # are the tag's section of the changelog, written by release.ps1 (scripts/changelog.py --notes).
      - name: Publish the release
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG.Substring(1)
          gh release create $env:TAG "dist/mboxer-$version.zip" "dist/mboxer-$version-macos.zip" dist/SHA256SUMS.txt `
            --verify-tag --title "mboxer $version" --notes-file "dist/release-notes-$version.md"
