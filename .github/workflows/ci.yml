# Tests, the dependency policy, the workflow lint and the commit rules (task 034) on every push and pull
# request; a `v<version>` tag also packs and publishes the portable zip, its checksum and its notes from the
# changelog (tasks 012, 025). The toolchain is the one `rust-toolchain.toml` names (stable), installed by the
# runner's own rustup, not by an action (task 033).
# Actions are pinned by commit SHA and bumped by dependabot (task 024).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# The cargo settings the former toolchain action exported: no incremental build in CI (it only grows the target
# cache, and the Rust cache keys on it) and coloured cargo output in the log.
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a pull request run; a main or tag run always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's preinstalled rustup installs what rust-toolchain.toml names: without an argument (rustup
      # 1.28+) the toolchain and its components, then by name to bring an older preinstalled stable up to date,
      # which the argumentless install leaves as it is. The last two lines put the result in the log.
      - name: Install the Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustup toolchain install --no-self-update "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup show
          rustup component list --installed
      # The cache only speeds up the tests; the release job builds without it, so nothing it holds is
      # published (the zizmor cache-poisoning finding is ignored in .github/zizmor.yml).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Advisories, licences, bans and sources of the shipped graph (deny.toml, D-011).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # The default features, as the exe is built; the action's own default is --all-features.
          arguments: ""
          command: check
      # The licence page of the release zip (about.toml, task 025) accepts exactly the licences deny.toml allows.
      - name: about.toml accepts the licences of deny.toml
        run: |
          python3 -I -c '
          import tomllib
          allow = sorted(tomllib.load(open("deny.toml", "rb"))["licenses"]["allow"])
          accepted = sorted(tomllib.load(open("about.toml", "rb"))["accepted"])
          raise SystemExit(0 if allow == accepted else f"deny.toml allows {allow}, about.toml accepts {accepted}")
          '

  # zizmor over the workflows and dependabot.yml; findings fail the job as annotations (the private repo
  # has no code scanning to upload SARIF to).
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false

  # The commit rules of docs/git-workflow.md (scripts/check-commit.sh) for every pushed or proposed commit and
  # the pull request text, which a squash merge turns into the commit message; the local hook can be skipped.
  commit-rules:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the commits and the pull request text
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          failed=0
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
            printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pull-request.txt"
            sh scripts/check-commit.sh "$RUNNER_TEMP/pull-request.txt" || { echo "  in the pull request text"; failed=1; }
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="$AFTER^!"
          else
            range="$BEFORE..$AFTER"
          fi
          for commit in $(git rev-list "$range"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message.txt"
            sh scripts/check-commit.sh "$RUNNER_TEMP/message.txt" \
              "$(git log -1 --format=%an "$commit")" "$(git log -1 --format=%ae "$commit")" \
              "$(git log -1 --format=%cn "$commit")" "$(git log -1 --format=%ce "$commit")" \
              || { echo "  in $commit"; failed=1; }
          done
          exit "$failed"

  release:
    needs: [test, deny, workflow-lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # creates the release and uploads the zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history with the tags: scripts/changelog.py tells the tasks of a release by the tag trees.
          fetch-depth: 0
      # The same toolchain as the test job, from rust-toolchain.toml (see the comment there).
      - name: Install the Rust toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustup toolchain install --no-self-update "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustup show
      # The licence page of the zip (task 025): a pinned cargo-about built from crates.io with its own lock
      # file; dependabot does not see this pin, so it is bumped by hand.
      - name: Install cargo-about
        shell: pwsh
        env:
          CARGO_ABOUT_VERSION: 0.9.2
        run: cargo install cargo-about --version $env:CARGO_ABOUT_VERSION --locked --features cli
      # No rust-cache here: a release is built from a clean target, never from a cache a pull request wrote.
      - name: Build and pack
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release.ps1 -Tag $env:TAG
      # The runner's own gh CLI publishes the release: no third-party action holds the write token. The notes
      # are the tag's section of the changelog, written by release.ps1 (scripts/changelog.py --notes).
      - name: Publish the release
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG.Substring(1)
          gh release create $env:TAG "dist/mboxer-$version.zip" dist/SHA256SUMS.txt --verify-tag `
            --title "mboxer $version" --notes-file "dist/release-notes-$version.md"
