name: Bug report
description: Something in mboxer does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please keep your mail private: no real message content, addresses or
        names here, and no screenshots of your own archive. A few lines of made-up mbox with
        `example.com` addresses reproduce almost anything. A security problem goes to a
        [private report](https://github.com/speti4/mboxer/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? Include the exact text of an error message or the status bar.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the mbox
        2. Search for ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mboxer version
      description: Shown at the right end of the status bar.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      description: "Windows: `winver` shows it, for example 24H2, build 26100. macOS: Apple menu → About This Mac, for example macOS 15.1 on Apple Silicon."
    validations:
      required: true
  - type: dropdown
    id: mbox-size
    attributes:
      label: Size of the mbox file
      options:
        - under 1 GB
        - 1–10 GB
        - 10–30 GB
        - over 30 GB
        - not related to a file
    validations:
      required: true
  - type: dropdown
    id: index-location
    attributes:
      label: Where the index lives
      description: "`.mboxer` beside the mbox, or, when that folder is not writable, `%LOCALAPPDATA%\\mboxer\\index\\` on Windows and `~/Library/Application Support/mboxer/index/` on macOS."
      options:
        - beside the mbox
        - under %LOCALAPPDATA% (Windows)
        - under ~/Library/Application Support (macOS)
        - not sure
  - type: textarea
    id: reproducer
    attributes:
      label: A made-up reproducer (optional)
      description: A few lines of synthetic mbox, or a screenshot of mboxer over made-up mail.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no real message content, addresses or names, and any reproducer uses made-up mail.
          required: true
